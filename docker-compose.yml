# Chạy toàn bộ hệ thống:  docker compose up --build
#   Frontend  http://localhost:5173
#   Backend   http://localhost:8080
#   MySQL     localhost:3307 (root / ${MYSQL_ROOT_PASSWORD})
# Biến môi trường tuỳ chọn (mật khẩu, JWT, mail, VNPay, Cloudinary...) đặt trong file .env (xem .env.example).
name: larose

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      MYSQL_DATABASE: la_rose
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Chỉ chạy lần đầu khi volume còn trống (theo thứ tự tên file)
      - ./data.sql:/docker-entrypoint-initdb.d/01-data.sql:ro
      - ./docker/mysql/02-services.sql:/docker-entrypoint-initdb.d/02-services.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./larose_be
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: la_rose
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      FRONTEND_BASE_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_BASE_URL: ${BACKEND_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:5173}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./La_Rose-main
      args:
        VITE_API_URL: ${BACKEND_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  uploads:
